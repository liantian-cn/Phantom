name = "liantian_cn.player_has_spell@dev"
display_name = "玩家是否掌握任一候选技能"
description = "known = C_SpellBook.IsSpellKnown(spellID)；inBook = C_SpellBook.IsSpellInSpellBook(spellID)；默认玩家法术书，返回布尔值，后者含覆盖技能。C_Timer.NewTimer(0.25, callback) 返回可取消 timer。任一 ID 已知或在法术书中即为真；与 player_has_talent 行为完全相同，事件后延迟 0.25 秒合并刷新。"
recommended_condition_name = "玩家是否掌握任一候选技能"

[parameters.spell_ids]
type = "list[int]"
required = true
description = "非空正整数技能 ID 列表，任一已知或在法术书中即为真。"

[returns]
type = "bool"
description = "任一 ID 已知或在法术书中即为真；与 player_has_talent 行为完全相同，事件后延迟 0.25 秒合并刷新。"
fallback = false
