name = "aura_player_buff_duration@dev"
author = "liantian-cn"
version = "dev"
display_name = "玩家增益剩余时间估计"
description = "官方 AuraContainer 单 AuraSlot 多 ID 首匹配玩家增益，SetDurationBar 使用 Immediate / RemainingTime，永久光环交官方处理。ValueBar 只定位并隐藏默认填充，由槽子级 StatusBar 显示；不读取秘密光环数据。"
recommended_condition_name = "{增益名称}剩余时间"
assisted_combat_rule_types = ["ASSISTED_COMBAT_RULE_TYPE_AURA_DURATION_PLAYER"]

[parameters.aura_ids]
type = "list[int]"
required = true
description = "非空正整数光环 ID 列表；官方首匹配，不保证按配置 ID 顺序。"

[parameters.duration]
type = "int"
required = true
description = "正整数秒，同时决定 ValueBar 内容宽度（每单位 4 像素）。不是官方固定绝对量程；实际光环时长与配置不同时估计有误差，0.25 秒仅为名义步长。"

[returns]
type = "float"
unit = "秒"
description = "ValueBar.ratio * 配置 duration 的浮点估计；无光环或解码失败为 0.0。"
fallback = 0.0
